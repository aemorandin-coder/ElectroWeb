<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Portada de historia destacada</title><style>
/* Portadas de las historias destacadas de Instagram: 1080 x 1920, Instagram muestra solo el círculo del centro.
   ?pose=…&ojos=…&boca=…&icono=… (ver ICONOS abajo). Sin texto: el nombre va debajo del círculo. */
@font-face { font-family: Tektrron; src: url(../assets/Tektrron.ttf); }
* { margin: 0; } body { width: 1080px; height: 1920px; overflow: hidden; }
#d { position: relative; width: 1080px; height: 1920px; background: #2a63cd; overflow: hidden; }
#d::before { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at 50% 50%, #3a73dd 0, #2a63cd 38%, #1e4ba3 75%); }
#aro { position: absolute; left: 80px; top: 500px; width: 920px; height: 920px; border-radius: 50%; background: #f4efe4; }
#ch { position: absolute; left: 60px; top: 400px; width: 960px; height: 1008px; }
#ch svg { width: 960px; height: 1008px; display: block; }
#ico { position: absolute; left: 670px; top: 1090px; width: 250px; height: 250px; border-radius: 50%; background: #fff; border: 10px solid #111317; display: flex; align-items: center; justify-content: center; }
#ico svg { width: 132px; height: 132px; }
</style></head><body><div id="d"><div id="aro"></div><div id="ch"></div><div id="ico"></div></div>
<script src="../mascota/chispa.js"></script><script>
const ICONOS = {
  carrito: '<circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/>',
  llave: '<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>',
  estrella: '<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>',
  camion: '<rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/>',
  telefono: '<rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/>',
  escudo: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><polyline points="9 12 11 14 15 10"/>',
  cursos: '<rect x="2" y="3" width="20" height="14" rx="2"/><polygon points="10 7 15 10 10 13 10 7"/><line x1="8" y1="21" x2="16" y2="21"/>',
  chip: '<rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><line x1="9" y1="1" x2="9" y2="4"/><line x1="15" y1="1" x2="15" y2="4"/><line x1="9" y1="20" x2="9" y2="23"/><line x1="15" y1="20" x2="15" y2="23"/><line x1="20" y1="9" x2="23" y2="9"/><line x1="20" y1="14" x2="23" y2="14"/><line x1="1" y1="9" x2="4" y2="9"/><line x1="1" y1="14" x2="4" y2="14"/>',
  chat: '<path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>',
  rayo: '<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>',
};
const q = new URLSearchParams(location.search);
document.getElementById('ch').innerHTML = chispa({ pose: q.get('pose') || 'habla', boca: q.get('boca') || 'feliz', ojos: q.get('ojos') || 'abiertos', cejas: q.get('cejas') || 'normal', fondo: false });
document.getElementById('ico').innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="${q.get('color') || '#2a63cd'}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${ICONOS[q.get('icono')] || ''}</svg>`;
</script></body></html>
