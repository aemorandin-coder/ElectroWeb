<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Portada: Más boletos para la PS4</title><style>
/* Portada del reel C-300 (1080 x 1920). Lo importante va en el centro (1080 x 1440, de 240 a 1680), que es lo que muestra
   la cuadrícula del perfil: la pregunta, la PS4 (remanufacturada) y Chispa con su cara «serio». */
@font-face { font-family: Poppins; src: url(../assets/poppins-latin-800-normal.woff2); font-weight: 800; }
@font-face { font-family: Poppins; src: url(../assets/poppins-latin-700-normal.woff2); font-weight: 700; }
@font-face { font-family: Poppins; src: url(../assets/poppins-latin-600-normal.woff2); font-weight: 600; }
@font-face { font-family: Serif; src: url(../assets/instrument-serif-latin-400-italic.woff2); font-style: italic; }
* { margin: 0; box-sizing: border-box; }
html, body { width: 540px; height: 960px; overflow: hidden; }
#p { position: relative; width: 540px; height: 960px; overflow: hidden; background: linear-gradient(180deg, #2f6ad6 0%, #1e4ba3 52%, #1a3b7e 100%); }
#p .pa { position: absolute; width: 700px; height: 420px; left: -330px; top: -170px; transform: rotate(-32deg); background: rgba(255,255,255,.07); }
#p .pb { position: absolute; width: 760px; height: 460px; right: -420px; bottom: -150px; transform: rotate(-32deg); background: rgba(255,255,255,.06); }
#logo { position: absolute; left: 50%; top: 136px; transform: translateX(-50%); background: #fff; padding: 7px 14px; border-radius: 999px; border: 2px solid #111317; }
#logo img { height: 22px; display: block; }
#t { position: absolute; left: 22px; right: 22px; top: 190px; text-align: center; color: #fff; font: 800 44px/1.02 Poppins; letter-spacing: -1.5px; text-shadow: 0 4px 16px rgba(0,0,0,.3); }
#t em { display: inline-block; margin-top: 8px; font: italic 400 56px/1 Serif; letter-spacing: 0; color: #111317; background: #fff; padding: 0 16px 8px; border: 3px solid #111317; border-radius: 12px; box-shadow: 4px 4px 0 #111317; transform: rotate(-2deg); }
#sub { position: absolute; left: 0; right: 0; top: 382px; text-align: center; color: #fff; font: 600 19px Poppins; opacity: .95; }
#ps4 { position: absolute; right: 18px; top: 430px; width: 270px; height: 270px; border-radius: 22px; overflow: hidden; border: 3px solid #fff; box-shadow: 0 18px 40px rgba(0,0,0,.35); transform: rotate(3deg); }
#ps4 img { width: 100%; height: 100%; object-fit: cover; display: block; }
#rm { position: absolute; right: 36px; top: 686px; background: #111317; color: #fff; font: 700 13px Poppins; padding: 6px 12px; border-radius: 8px; transform: rotate(3deg); }
#disc, #chispa { position: absolute; left: -24px; top: 468px; width: 400px; height: 420px; transform-origin: 0 0; transform: scale(.82); }
#disc svg, #chispa svg { width: 400px; height: 420px; display: block; }
#fecha { position: absolute; left: 50%; top: 790px; transform: translateX(-50%) rotate(-2deg); background: #fff; color: #111317; font: 800 21px Poppins; padding: 9px 18px; border-radius: 12px; border: 3px solid #111317; box-shadow: 4px 4px 0 #111317; white-space: nowrap; }
</style></head><body><div id="p">
<div class="pa"></div><div class="pb"></div>
<div id="logo"><img src="../assets/logo-color.png" alt=""></div>
<div id="t">¿Tu amigo ya<br><em>activó su cuenta?</em></div>
<div id="sub">Y cómo ganar más boletos comprando</div>
<div id="ps4"><img src="../assets/sorteo/premio-ps4.jpg" alt=""></div>
<div id="rm">PS4 remanufacturada</div>
<div id="disc"><svg viewBox="0 0 400 420"><circle cx="200" cy="232" r="150" fill="#1a3b7e"/><circle cx="200" cy="232" r="166" fill="none" stroke="#fff" stroke-width="2.5" stroke-dasharray="2 9" stroke-linecap="round" opacity=".5"/></svg></div>
<div id="chispa"></div>
<div id="fecha">Sorteo: 20 de diciembre</div>
</div>
<script src="../mascota/chispa.js"></script>
<script>
document.getElementById('chispa').innerHTML = chispa({ pose: 'señala', expresion: 'serio', fondo: false });
window.DURATION = 1; window.seek = () => {};
window.ready = document.fonts.ready.then(() => Promise.all(Array.from(document.images).map((i) => (i.complete ? 1 : new Promise((r) => { i.onload = r; i.onerror = r; }))))).then(() => true);
</script>
</body></html>
