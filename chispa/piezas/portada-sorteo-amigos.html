<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Portada: Más boletos para la PS4</title><style>
/* Portada épica del reel C-300 (1080 x 1920). Todo lo importante queda dentro del centro 1080 x 1440 (y: 120..840 px)
   para que la cuadrícula de Instagram y TikTok no corte nada. Chispa apoya detrás de la tarjeta inferior (sin corte al aire). */
@font-face { font-family: Poppins; src: url(../assets/poppins-latin-800-normal.woff2); font-weight: 800; }
@font-face { font-family: Poppins; src: url(../assets/poppins-latin-700-normal.woff2); font-weight: 700; }
@font-face { font-family: Poppins; src: url(../assets/poppins-latin-600-normal.woff2); font-weight: 600; }
@font-face { font-family: Serif; src: url(../assets/instrument-serif-latin-400-italic.woff2); font-style: italic; }
* { margin: 0; box-sizing: border-box; }
html, body { width: 540px; height: 960px; overflow: hidden; }
#p { position: relative; width: 540px; height: 960px; overflow: hidden;
  background: radial-gradient(circle at 74% 52%, rgba(74,132,240,.42) 0%, transparent 48%),
              radial-gradient(circle at 24% 66%, rgba(42,99,205,.45) 0%, transparent 46%),
              linear-gradient(175deg, #2a63cd 0%, #1e4ba3 48%, #132c61 100%); }
/* cuadrícula sutil y franjas diagonales */
#p .grid { position: absolute; inset: 0;
  background-image: linear-gradient(rgba(255,255,255,.06) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(255,255,255,.06) 1px, transparent 1px);
  background-size: 30px 30px; }
#p .pa { position: absolute; width: 720px; height: 380px; left: -340px; top: -150px; transform: rotate(-30deg); background: rgba(255,255,255,.06); }
#p .pb { position: absolute; width: 760px; height: 420px; right: -410px; bottom: -140px; transform: rotate(-30deg); background: rgba(255,255,255,.05); }

/* cabecera segura (y >= 138) */
#top { position: absolute; left: 20px; right: 20px; top: 138px; display: flex; align-items: center; justify-content: center; gap: 10px; z-index: 20; }
#logo { background: #fff; padding: 6px 14px; border-radius: 999px; border: 2.5px solid #111317; box-shadow: 3px 3px 0 #111317; }
#logo img { height: 20px; display: block; }
#evento { background: #1a3b7e; color: #fff; padding: 6px 12px; border-radius: 999px; border: 2.5px solid #111317; box-shadow: 3px 3px 0 #111317;
  font: 800 11.5px/1 Poppins; letter-spacing: .6px; display: inline-flex; align-items: center; gap: 6px; }

/* titular principal */
#t { position: absolute; left: 16px; right: 16px; top: 184px; text-align: center; color: #fff; font: 800 45px/1.02 Poppins;
  letter-spacing: -1.5px; text-shadow: 0 5px 18px rgba(0,0,0,.38); z-index: 20; }
#t em { display: inline-block; margin-top: 8px; white-space: nowrap; font: italic 400 52px/.96 Serif; letter-spacing: 0; color: #111317; background: #ffd54a;
  padding: 2px 18px 9px; border: 3.5px solid #111317; border-radius: 16px; box-shadow: 7px 7px 0 #111317; transform: rotate(-2deg); text-shadow: none; }
#sub { position: absolute; left: 50%; top: 308px; transform: translateX(-50%); white-space: nowrap;
  background: rgba(17,19,23,.84); color: #fff; padding: 7px 16px; border-radius: 999px; border: 2px solid rgba(255,255,255,.22);
  font: 600 15.5px/1.1 Poppins; box-shadow: 0 8px 20px rgba(0,0,0,.28); z-index: 20; }

/* estado amigos: Falta activar -> Cuenta */
#estado { position: absolute; right: 20px; top: 360px; transform: rotate(-2.2deg); background: #fff; border: 3px solid #111317;
  box-shadow: 4px 4px 0 #111317; border-radius: 12px; padding: 5px 9px; display: flex; align-items: center; gap: 6px; z-index: 22; }
.pill-off { background: #1a3b7e; color: #fff; padding: 3px 8px; border-radius: 999px; font: 700 10.5px/1 Poppins; }
.pill-on { background: #047857; color: #fff; padding: 3px 8px; border-radius: 999px; font: 700 10.5px/1 Poppins; display: inline-flex; align-items: center; gap: 3px; }

/* tarjeta del premio */
#ps4 { position: absolute; right: 20px; top: 386px; width: 256px; height: 256px; border-radius: 20px; overflow: hidden;
  border: 3.5px solid #111317; background: #1a3b7e; box-shadow: 8px 8px 0 #111317, 0 22px 44px rgba(0,0,0,.45); transform: rotate(2.5deg); z-index: 14; }
#ps4 img { width: 100%; height: 100%; object-fit: cover; display: block; }
#rm { position: absolute; left: 10px; right: 10px; bottom: 10px; background: rgba(17,19,23,.92); color: #fff;
  font: 700 12px/1.15 Poppins; padding: 6px 8px; border-radius: 9px; text-align: center; border: 1.5px solid rgba(255,255,255,.22); }

/* fichas de la escalera de compras */
#fichas { position: absolute; right: 20px; top: 656px; display: flex; gap: 7px; transform: rotate(1.5deg); z-index: 22; }
.ficha { display: flex; flex-direction: column; align-items: center; min-width: 78px; padding: 6px 8px; border-radius: 12px;
  border: 3px solid #111317; box-shadow: 4px 4px 0 #111317; font-family: Poppins; }
.ficha b { font-size: 16px; font-weight: 800; line-height: 1.05; }
.ficha span { font-size: 10px; font-weight: 700; opacity: .88; margin-top: 2px; }
.ficha.f1 { background: #fff; color: #111317; }
.ficha.f2 { background: #2a63cd; color: #fff; }
.ficha.f3 { background: #ffd54a; color: #111317; }

/* Chispa apoyado detrás de la tarjeta inferior (sin corte al aire) */
#disc, #chispa { position: absolute; left: -24px; top: 404px; width: 400px; height: 420px; transform-origin: 0 0; transform: scale(.86); }
#disc { z-index: 10; }
#chispa { z-index: 15; }
#disc svg, #chispa svg { width: 400px; height: 420px; display: block; }

/* tarjeta inferior dentro del centro 1080 x 1440 (y <= 832) */
#pie { position: absolute; left: 22px; right: 22px; top: 734px; background: #fff; color: #111317;
  border: 3.5px solid #111317; border-radius: 16px; box-shadow: 7px 7px 0 #111317; padding: 10px 16px;
  display: flex; align-items: center; justify-content: space-between; gap: 10px; z-index: 30; }
#pie .izq { display: flex; align-items: center; gap: 10px; }
#pie .ico { width: 38px; height: 38px; border-radius: 10px; background: #2a63cd; color: #fff; display: flex; align-items: center; justify-content: center; flex-shrink: 0; border: 2px solid #111317; }
#pie b { display: block; font: 800 17px/1.1 Poppins; }
#pie small { display: block; font: 600 12px/1.2 Poppins; color: #495057; margin-top: 2px; }
#pie .cta { background: #ffd54a; color: #111317; font: 800 13px/1 Poppins; padding: 8px 12px; border-radius: 10px; border: 2.5px solid #111317; white-space: nowrap; }

/* chispas geométricas decorativas */
.sp { position: absolute; z-index: 18; opacity: .9; }
</style></head><body><div id="p">
  <div class="grid"></div><div class="pa"></div><div class="pb"></div>

  <svg class="sp" style="left:30px;top:372px" width="22" height="22" viewBox="0 0 24 24"><path d="M12 2l2.4 7.6L22 12l-7.6 2.4L12 22l-2.4-7.6L2 12l7.6-2.4z" fill="#ffd54a" stroke="#111317" stroke-width="1.8"/></svg>
  <svg class="sp" style="right:26px;top:172px" width="18" height="18" viewBox="0 0 24 24"><path d="M12 2l2.4 7.6L22 12l-7.6 2.4L12 22l-2.4-7.6L2 12l7.6-2.4z" fill="#fff" stroke="#111317" stroke-width="1.8"/></svg>

  <div id="top">
    <div id="logo"><img src="../assets/logo-color.png" alt="ElectroShop"></div>
    <div id="evento">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 12 20 22 4 22 4 12"/><rect x="2" y="7" width="20" height="5"/><line x1="12" y1="22" x2="12" y2="7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/></svg>
      SORTEO DE NAVIDAD
    </div>
  </div>

  <div id="t">¿Tu amigo ya<br><em>activó su cuenta?</em></div>
  <div id="sub">Y cómo ganar muchos más boletos comprando</div>

  <div id="estado">
    <span class="pill-off">Falta activar</span>
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#111317" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
    <span class="pill-on"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>Cuenta</span>
  </div>

  <div id="ps4">
    <img src="../assets/sorteo/premio-ps4.jpg" alt="PlayStation 4 remanufacturada">
    <div id="rm">PS4 remanufacturada · 1000 GB</div>
  </div>

  <div id="fichas">
    <div class="ficha f1"><b>+2</b><span>desde $5</span></div>
    <div class="ficha f2"><b>+5</b><span>desde $50</span></div>
    <div class="ficha f3"><b>+10</b><span>$100 o estrella</span></div>
  </div>

  <div id="disc"><svg viewBox="0 0 400 420"><circle cx="200" cy="232" r="150" fill="#1a3b7e"/><circle cx="200" cy="232" r="166" fill="none" stroke="#fff" stroke-width="2.5" stroke-dasharray="2 9" stroke-linecap="round" opacity=".55"/></svg></div>
  <div id="chispa"></div>

  <div id="pie">
    <div class="izq">
      <div class="ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/><path d="M13 5v2"/><path d="M13 17v2"/><path d="M13 11v2"/></svg></div>
      <div>
        <b>Sorteo: 20 de diciembre</b>
        <small>electroshopve.com/sorteo</small>
      </div>
    </div>
    <div class="cta">Ver guía</div>
  </div>
</div>
<script src="../mascota/chispa.js"></script>
<script>
document.getElementById('chispa').innerHTML = chispa({ pose: 'señala', expresion: 'serio', fondo: false });
window.DURATION = 1; window.seek = () => {};
window.ready = document.fonts.ready.then(() => Promise.all(Array.from(document.images).map((i) => (i.complete ? 1 : new Promise((r) => { i.onload = r; i.onerror = r; }))))).then(() => true);
</script>
</body></html>
