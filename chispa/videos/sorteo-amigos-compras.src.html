<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Más boletos para la PS4 (C-300)</title>
<style>
/*BASE*/
/* ---------- Propio de este reel (guiones/sorteo-amigos-y-compras.md) ----------
   Dos momentos: Chispa grande cuando habla solo (el gancho, el giro a las compras) y el teléfono grande con las capturas
   reales, con Chispa chico en la esquina. Fondo oscuro para el problema (los amigos sin activar), azul para las compras. */
#stage { background: #151618; }
#ph { position: absolute; left: 150px; top: 92px; width: 302px; height: 654px; z-index: 10; }
#ph .fr { position: absolute; inset: 0; border-radius: 46px; background: #0d0e10; padding: 8px;
  box-shadow: 0 0 0 2px #2c2f34, 0 0 0 3px #0a0a0b, 0 34px 70px rgba(0,0,0,.55), 0 10px 25px rgba(0,0,0,.35); }
#ph .sc { position: relative; width: 100%; height: 100%; border-radius: 38px; overflow: hidden; background: #fff; }
#ph .st { position: relative; height: 30px; display: flex; align-items: center; justify-content: space-between; padding: 2px 22px 0 28px;
  font: 600 12px/1 Inter; color: #111; background: #fff; z-index: 3; }
#ph .isl { position: absolute; left: 50%; top: 7px; width: 78px; height: 21px; margin-left: -39px; border-radius: 12px; background: #000; z-index: 4; }
#ph .vi { position: absolute; left: 0; top: 30px; width: 286px; height: 608px; overflow: hidden; }
#zoom { position: absolute; left: 0; top: 0; width: 286px; height: 619px; }
.shot { position: absolute; left: 0; top: 0; width: 286px; opacity: 0; }
.ring { position: absolute; border: 3px solid #2a63cd; border-radius: 10px; box-shadow: 0 0 0 3px #fff, 0 0 18px rgba(42,99,205,.55); opacity: 0; z-index: 5; }
#cap2 { position: absolute; left: 0; right: 0; margin: 0 auto; width: max-content; top: 30px; z-index: 30;
  display: flex; align-items: center; gap: 9px; padding: 6px 16px 6px 6px; border-radius: 999px;
  background: linear-gradient(180deg, #fff 0%, #e9ebee 100%); box-shadow: 0 10px 30px rgba(0,0,0,.35);
  font: 700 16px/1.2 Poppins, sans-serif; color: #15171a; white-space: nowrap; }
#cap2 .av { width: 32px; height: 32px; border-radius: 50%; background: #2a63cd; color: #fff; display: flex; align-items: center; justify-content: center; }
#cap2 b { color: #1e4ba3; }
.st2 { position: absolute; z-index: 26; white-space: nowrap; display: inline-flex; align-items: center; gap: 8px; padding: 9px 15px; border-radius: 12px;
  font: 800 18px/1.15 Poppins, sans-serif; box-shadow: 0 14px 30px rgba(0,0,0,.35); opacity: 0; }
.st2.dark { background: #16181b; color: #fff; border: 1px solid rgba(255,255,255,.1); }
.st2.light { background: #fff; color: #15171a; }
.st2.blue { background: #2a63cd; color: #fff; border: 2px solid #fff; }
.st2.ok { background: #047857; color: #fff; border: 2px solid #fff; }
.st2 small { display: block; font: 600 12.5px Inter; opacity: .85; margin-top: 2px; }
#ojo { left: 60px; top: 150px; font-size: 64px; padding: 10px 26px; border-radius: 18px; }
#comprar { left: 92px; top: 170px; font-size: 54px; padding: 12px 26px; border-radius: 18px; }
#disc, #chispa { position: absolute; left: 0; top: 0; width: 400px; height: 420px; transform-origin: 0 0; }
#chispa { z-index: 20; } #disc { z-index: 19; }
#disc svg, #chispa svg { width: 400px; height: 420px; display: block; }
#sub { position: absolute; left: 0; right: 0; display: flex; justify-content: center; z-index: 40; }
#pill { display: flex; flex-wrap: wrap; justify-content: center; gap: 5px; max-width: 330px; padding: 6px 10px; border-radius: 8px; background: #111317; color: #fff;
  font: 700 17px Poppins; visibility: hidden; box-shadow: 0 8px 20px rgba(0,0,0,.35); }
#pill span { padding: 1px 5px; border-radius: 5px; }
#pill span.on { background: #2a63cd; }
.azul #pill span.on { background: #ffd54a; color: #111317; }
#legal { position: absolute; left: 0; right: 0; bottom: 6px; text-align: center; font: 500 9px Inter; color: rgba(255,255,255,.55); z-index: 50; }
</style></head>
<body>
<div id="stage">
  <div id="bgDark"><div class="grid"></div></div>
  <div id="bgBlue"><div class="panel pA"></div><div class="panel pB"></div><div class="panel pC"></div><div class="glow"></div></div>
  <div class="noise"></div>

  <div id="cap2"><span class="av"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h18v4a2 2 0 0 0 0 4v4H3v-4a2 2 0 0 0 0-4z"/><path d="M14 7v12" stroke-dasharray="2 2.5"/></svg></span><span id="capTx"></span></div>

  <div id="ph"><div class="fr"><div class="sc">
    <div class="st"><span>9:41</span><span style="display:flex;gap:4px;align-items:center"><svg width="16" height="11" viewBox="0 0 16 11"><rect x="0" y="7" width="3" height="4" rx="1" fill="#111"/><rect x="4.3" y="5" width="3" height="6" rx="1" fill="#111"/><rect x="8.6" y="2.5" width="3" height="8.5" rx="1" fill="#111"/><rect x="12.9" y="0" width="3" height="11" rx="1" fill="#111"/></svg><svg width="22" height="11" viewBox="0 0 22 11"><rect x=".5" y=".5" width="18" height="10" rx="3" fill="none" stroke="#111" opacity=".5"/><rect x="2" y="2" width="13" height="7" rx="1.8" fill="#111"/><rect x="19.5" y="3.5" width="1.6" height="4" rx=".8" fill="#111" opacity=".5"/></svg></span></div>
    <div class="isl"></div>
    <div class="vi"><div id="zoom">
      <img class="shot" id="s1" src="../assets/sorteo/c1-premio.webp" alt="">
      <img class="shot" id="s2" src="../assets/sorteo/c2-falta-activar.webp" alt="">
      <img class="shot" id="s3" src="../assets/sorteo/c3-correo.webp" alt="">
      <img class="shot" id="s4" src="../assets/sorteo/c4-ya-cuenta.webp" alt="">
      <img class="shot" id="s5" src="../assets/sorteo/c5-escalera.webp" alt="">
      <img class="shot" id="s6" src="../assets/sorteo/c6-estrella.webp" alt="">
      <img class="shot" id="s8" src="../assets/sorteo/c8-resenas.webp" alt="">
      <img class="shot" id="s9" src="../assets/sorteo/c9-carrito.webp" alt="">
      <div class="ring" id="ring"></div>
    </div></div>
  </div></div></div>

  <div class="st2 dark" id="ojo">¡OJO!</div>
  <div class="st2 dark" id="noCuenta" style="left:22px;top:430px;transform:rotate(-3deg)">No cuenta<small>todavía</small></div>
  <div class="st2 ok" id="yaCuenta" style="left:28px;top:430px;transform:rotate(-3deg)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>¡Ya cuenta!</div>
  <div class="st2 light" id="regla" style="left:14px;top:500px;transform:rotate(-2deg)">2 amigos = 1 boleto<small style="color:#495057">Hasta 3 boletos</small></div>
  <div class="st2 blue" id="comprar"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg>¡Comprar!</div>
  <div class="st2 blue" id="mas10" style="left:16px;top:430px;transform:rotate(-3deg)">+10 boletos<small>por cada uno</small></div>
  <div class="st2 light" id="mas1" style="left:22px;top:430px;transform:rotate(-3deg)">+1 boleto<small style="color:#495057">por reseña aprobada</small></div>
  <div class="st2 light" id="web" style="left:50%;top:640px;margin-left:-150px;width:300px;justify-content:center;font-size:21px">electroshopve.com/sorteo</div>
  <div class="st2 blue" id="fecha" style="left:20px;top:430px;transform:rotate(-3deg)">20 de diciembre<small>el resultado</small></div>

  <div id="sub"><div id="pill"></div></div>
  <div id="disc"><svg viewBox="0 0 400 420"><circle cx="200" cy="232" r="150" fill="#2a63cd"/><circle cx="200" cy="232" r="166" fill="none" stroke="#fff" stroke-width="2.5" stroke-dasharray="2 9" stroke-linecap="round" opacity=".5"/></svg></div>
  <div id="chispa"></div>
  <div id="legal">PlayStation y PS4 son marcas de Sony Interactive Entertainment. Consola remanufacturada.</div>
</div>
<script src="../mascota/chispa.js"></script>
<script>
const VOZ = /*VOZ:chispa-sorteo-amigos-compras*/;
const MARCAS = /*JSON:sorteo/marcas.json*/;
const $ = (s) => document.querySelector(s);
const norm = (w) => w.toLowerCase().replace(/[^a-z0-9áéíóúñü]/g, '');
// D(palabra, desde): cuándo empieza la primera vez que se dice esa palabra después de `desde` (todo tiempo se ata a una palabra)
const D = (w, desde = 0) => { const p = VOZ.palabras.find((q) => norm(q.w) === norm(w) && q.t0 >= desde - .001); if (!p) throw new Error('falta ' + w); return p.t0; };
const FIN = VOZ.palabras[VOZ.palabras.length - 1].t1;
window.DURATION = Math.ceil((FIN + .9) * 10) / 10;

// Cómo se escribe en pantalla: "electroshopve punto com, barra sorteo" es electroshopve.com/sorteo
const VER = VOZ.palabras.map((p) => ({ ...p }));
VER.forEach((p, i) => { if (norm(p.w) === 'electroshopve') { p.w = 'electroshopve.com/sorteo.'; for (let k = 1; k <= 4 && VER[i + k]; k++) VER[i + k].oculta = true; } });

// Los momentos (guiones/sorteo-amigos-y-compras.md)
const T = {};
T.ojo = D('ojo'); T.sorteo = D('sorteo'); T.ti = D('ti'); T.tu = D('tu', T.ti); T.activar = D('activar', T.tu); T.mandale = D('mándale');
T.abre = D('abre'); T.activar2 = D('activar', T.abre); T.listo = D('listo'); T.cada = D('cada', T.listo); T.pero = D('pero'); T.comprar = D('comprar');
T.desde = D('desde', T.comprar); T.cinco = D('cinco', T.desde); T.cincuenta = D('cincuenta'); T.cien = D('cien'); T.semana = D('semana');
T.diez = D('diez', T.semana); T.llego = D('llegó'); T.aprobamos = D('aprobamos'); T.carrito = D('carrito'); T.todo = D('todo', T.carrito);
T.bases = D('bases'); T.electro = D('electroshopve'); T.veinte = D('veinte'); T.puede = D('puede');

// Subtítulos: ventanas de hasta 4 palabras, cortadas en la puntuación
const vis = VER.map((p, i) => i).filter((i) => !VER[i].oculta);
const ventanas = []; let cur = [];
vis.forEach((i, k) => { cur.push(i); if (/[.,:?!…]$/.test(VER[i].w) || cur.length >= 4 || k === vis.length - 1) { ventanas.push(cur); cur = []; } });
function subtitulos(t) {
  let wi = -1; vis.forEach((i) => { if (t >= VER[i].t0 - .02) wi = i; });
  let fin = wi >= 0 ? VER[wi].t1 : 0; for (let k = wi + 1; k < VER.length && VER[k].oculta; k++) fin = VER[k].t1;
  const ve = wi >= 0 && t < fin + .45; $('#pill').style.visibility = ve ? 'visible' : 'hidden'; if (!ve) return;
  const v = ventanas.find((vs) => vs.includes(wi));
  $('#pill').innerHTML = v.map((i) => `<span class="${i === wi ? 'on' : ''}">${VER[i].w.replace(/[.,:…]$/, '')}</span>`).join('');
}

// Chispa 3.1: pose y cara por palabra, boca por vocal, parpadeo y respiración
const AL_TELEFONO = [.75, -.55];
const linea = chispa.linea([
  { t: 0, pose: 'señala', expresion: 'serio' },
  { t: T.sorteo - .1, pose: 'habla', expresion: 'serio', mirar: AL_TELEFONO },
  { t: T.tu - .1, pose: 'explica', expresion: 'pensativo', mirar: AL_TELEFONO },
  { t: T.mandale - .1, pose: 'telefono', expresion: 'alegre', mirar: 'telefono' },
  { t: T.listo - .15, pose: 'ok', expresion: 'alegre', mirar: [0, 0] },
  { t: T.cada - .1, pose: 'pulgar', expresion: 'alegre', mirar: [0, 0] },
  { t: T.pero - .1, pose: 'hombros', expresion: 'sorpresa', mirar: [0, 0] },
  { t: T.comprar - .1, pose: 'celebra', expresion: 'risa' },
  { t: T.desde - .1, pose: 'explica', expresion: 'alegre', mirar: AL_TELEFONO },
  { t: T.semana - .1, pose: 'presenta', expresion: 'orgulloso', mirar: AL_TELEFONO },
  { t: T.llego - .1, pose: 'ok', expresion: 'alegre', mirar: [0, 0] },
  { t: T.carrito - .1, pose: 'señala', expresion: 'alegre', mirar: AL_TELEFONO },
  { t: T.bases - .1, pose: 'brazos', expresion: 'orgulloso', mirar: [0, 0] },
  { t: T.puede - .1, pose: 'saluda', expresion: 'alegre' },
]);
const labios = chispa.labios(VOZ);
const clamp = (x) => Math.min(1, Math.max(0, x));
const ease = (x) => 1 - Math.pow(1 - clamp(x), 3);
const back = (x) => { x = clamp(x); return 1 + 2.4 * Math.pow(x - 1, 3) + 1.4 * Math.pow(x - 1, 2); };
const lerp = (a, b, k) => a + (b - a) * k;

// Chispa grande (solo) o chico en la esquina (con el teléfono)
const GRANDE = { x: 70, y: 520, s: 1 }, CHICO = { x: -26, y: 714, s: .52 };
const tramosGrande = [[-1, T.sorteo - .1], [T.pero - .1, T.desde - .15]];
function cuantoGrande(t) {
  // 1 = grande, 0 = chico, con transición de .45 s
  let g = 0;
  for (const [a, b] of tramosGrande) { if (t >= a && t < b) g = Math.max(g, a < 0 ? 1 : back((t - a) / .45)); else if (t >= b && t < b + .45) g = Math.max(g, 1 - ease((t - b) / .45)); }
  return g;
}

// Las capturas: cuál se ve, con un zoom lento hacia lo que se dice, y el aro sobre lo importante
const K = 286 / 390; // px de la captura del teléfono (390 de ancho) a px de la pantalla
const caja = (shot, texto, pad = 5) => { const r = MARCAS[shot][texto]; return [r[0] - pad, r[1] - pad, r[2] + 2 * pad, r[3] + 2 * pad]; };
const PLANOS = [
  { id: '#s1', a: -1, b: T.tu - .1, shot: 'C1-premio' },
  { id: '#s2', a: T.tu - .1, b: T.abre - .1, shot: 'C2-falta-activar', aros: [[T.activar - .05, T.mandale - .1, caja('C2-falta-activar', 'Falta activar')], [T.mandale - .05, T.abre - .1, caja('C2-falta-activar', 'Recordarles por WhatsApp', 3)]] },
  { id: '#s3', a: T.abre - .1, b: T.listo - .1, shot: 'C3-correo-activacion', aros: [[T.activar2 - .05, T.listo - .1, caja('C3-correo-activacion', 'Activar mi cuenta', 3)]] },
  { id: '#s4', a: T.listo - .1, b: T.pero - .1, shot: 'C4-ya-cuenta', aros: [[T.listo, T.cada - .1, [30, 199, 318, 34]], [T.cada, T.pero - .1, caja('C4-ya-cuenta', '1 de 3 boletos')]] },
  { id: '#s5', a: T.desde - .15, b: T.semana - .1, shot: 'C5-escalera', aros: [[T.cinco - .05, T.cincuenta - .05, [112, 196, 70, 100]], [T.cincuenta - .05, T.cien - .05, [186, 196, 70, 100]], [T.cien - .05, T.semana - .1, [261, 196, 70, 100]]] },
  { id: '#s6', a: T.semana - .1, b: T.llego - .1, shot: 'C6-producto-estrella', aros: [[T.diez - .1, T.llego - .1, caja('C6-producto-estrella', 'boletos por cada uno', 4)]] },
  { id: '#s8', a: T.llego - .1, b: T.carrito - .1, shot: 'C8-resenas', aros: [[T.aprobamos - .1, T.carrito - .1, caja('C8-resenas', '1 boleto por cada reseña', 4)]] },
  { id: '#s9', a: T.carrito - .1, b: T.todo - .1, shot: 'C9b-carrito-boletos', aros: [[T.carrito, T.todo - .1, [44, 306, 292, 102]]] },
  { id: '#s1', a: T.todo - .1, b: 999, shot: 'C1-premio', aros: [[T.veinte - .05, 999, caja('C1-premio', 'Remanufacturada', 4)]] },
];
const PLANO_DE = (t) => PLANOS.find((p) => t >= p.a && t < p.b);

function telefono(t, g) {
  // el teléfono entra desde abajo cuando Chispa se achica, y sale en el giro a las compras
  const y = lerp(0, 760, g); $('#ph').style.transform = `translateY(${y.toFixed(1)}px)`; $('#ph').style.opacity = g > .98 ? 0 : 1;
  const p = PLANO_DE(t);
  document.querySelectorAll('.shot').forEach((im) => { im.style.opacity = 0; });
  let ring = null;
  if (p) {
    // fundido corto con la anterior
    const i = PLANOS.indexOf(p), prev = PLANOS[i - 1], k = clamp((t - p.a) / .22);
    if (prev && k < 1 && prev.b === p.a) $(prev.id).style.opacity = 1;
    $(p.id).style.opacity = prev && prev.b === p.a ? k : 1;
    for (const [a, b, r] of p.aros || []) if (t >= a && t < b) ring = { a, r };
    // zoom lento hacia el aro (o al centro de arriba si no hay)
    const foco = ring ? [ (ring.r[0] + ring.r[2] / 2) * K, (ring.r[1] + ring.r[3] / 2) * K ] : [143, 200];
    const z = 1 + .14 * ease((t - p.a) / 3.5);
    $('#zoom').style.transformOrigin = `${foco[0].toFixed(1)}px ${foco[1].toFixed(1)}px`;
    $('#zoom').style.transform = `scale(${z.toFixed(4)})`;
  }
  const el = $('#ring');
  if (ring) {
    const [x, y2, w, h] = ring.r.map((v) => v * K), k = back((t - ring.a) / .35), pulso = 1 + .03 * Math.sin((t - ring.a) * 6);
    Object.assign(el.style, { left: x + 'px', top: y2 + 'px', width: w + 'px', height: h + 'px', opacity: clamp((t - ring.a) / .15), transform: `scale(${(k * pulso).toFixed(3)})` });
  } else el.style.opacity = 0;
}

// Una etiqueta que aparece con rebote y se va
const ver = (sel, t, a, b, desde = 14) => {
  const el = $(sel), k = t < a ? 0 : t < b ? back((t - a) / .38) : 1 - ease((t - b) / .25);
  el.style.opacity = (t < a ? 0 : t < b ? clamp((t - a) / .18) : clamp(1 - (t - b) / .25)).toFixed(3);
  const rot = (el.style.transform.match(/rotate\([^)]*\)/) || [''])[0] || el.dataset.rot || '';
  if (!el.dataset.rot) el.dataset.rot = rot;
  el.style.transform = `translateY(${(desde * (1 - k)).toFixed(1)}px) scale(${(.85 + .15 * k).toFixed(3)}) ${el.dataset.rot}`;
};

let ultimo = '';
window.seek = (t) => {
  const g = cuantoGrande(t);
  // el fondo pasa al azul en el giro a las compras
  const az = clamp((t - (T.pero - .1)) / .5);
  $('#bgBlue').style.clipPath = `circle(${(az * 120).toFixed(1)}% at 50% 55%)`;
  document.body.classList.toggle('azul', az > .5);
  $('#capTx').innerHTML = t < T.pero - .1 ? 'Sorteo de la PS4: <b>tus amigos</b>' : t < T.todo - .1 ? 'Sorteo de la PS4: <b>comprando</b>' : '<b>electroshopve.com</b>/sorteo';

  // Chispa
  const e = linea(t);
  const p = VOZ.palabras.find((q) => t >= q.t0 - .03 && t < q.t1 + .05);
  if (p) { const b = labios(t); Object.assign(e.boca, b, { sonrisa: Math.max(b.sonrisa, e.boca.sonrisa * .6) }); }
  chispa.vida(e, t, { rms: p ? VOZ.rms[Math.floor(t * 30)] : null });
  e.fondo = false;
  const svg = chispa.rig(e); if (svg !== ultimo) { $('#chispa').innerHTML = svg; ultimo = svg; }
  const x = lerp(CHICO.x, GRANDE.x, g), y = lerp(CHICO.y, GRANDE.y, g), s = lerp(CHICO.s, GRANDE.s, g);
  const entra = (1 - back(t / .55)) * 180;
  for (const id of ['#chispa', '#disc']) $(id).style.transform = `translate(${x.toFixed(1)}px, ${(y + entra).toFixed(1)}px) scale(${s.toFixed(4)})`;

  telefono(t, g);
  // los subtítulos: al medio con Chispa grande, abajo a la derecha con el teléfono
  $('#sub').style.top = lerp(770, 486, g).toFixed(1) + 'px';
  $('#sub').style.paddingLeft = lerp(170, 0, g).toFixed(1) + 'px';

  ver('#ojo', t, T.ojo - .05, T.sorteo - .2, 30);
  ver('#noCuenta', t, T.activar - .1, T.mandale - .15);
  ver('#yaCuenta', t, T.listo, T.cada - .15);
  ver('#regla', t, T.cada, T.pero - .15);
  ver('#comprar', t, T.comprar - .05, T.desde - .2, 30);
  ver('#mas10', t, T.diez - .05, T.llego - .15);
  ver('#mas1', t, T.aprobamos, T.carrito - .15);
  ver('#fecha', t, T.veinte - .05, 999);
  ver('#web', t, T.electro - .05, 999, 10);
  subtitulos(t);
};
window.ready = document.fonts.ready.then(() => Promise.all(Array.from(document.images).map((i) => (i.complete ? 1 : new Promise((r) => { i.onload = r; i.onerror = r; }))))).then(() => { window.seek(0); return true; });
</script>
</body></html>
