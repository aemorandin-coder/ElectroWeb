<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Capa de textos: Andrés y Chispa</title><style>
/* Textos encima de los clips de Google Flow (fondo transparente): logo, título, nombre de Chispa y contacto. 540 x 960 a 2x. */
@font-face { font-family: Poppins; src: url(assets/poppins-latin-700-normal.woff2); font-weight: 700; }
@font-face { font-family: Poppins; src: url(assets/poppins-latin-800-normal.woff2); font-weight: 800; }
@font-face { font-family: Serif; src: url(assets/instrument-serif-latin-400-italic.woff2); font-style: italic; }
@font-face { font-family: Inter; src: url(assets/InterVariable.woff2); font-weight: 100 900; }
* { margin: 0; box-sizing: border-box; }
html, body { width: 540px; height: 960px; background: transparent; overflow: hidden; }
.p { position: absolute; opacity: 0; }
#logo { left: 18px; top: 18px; background: #fff; padding: 6px 12px 6px 8px; border-radius: 999px; border: 2px solid #111317; }
#logo img { height: 18px; display: block; }
#titulo { left: 0; right: 0; top: 742px; text-align: center; }
#titulo span { display: inline-block; background: #fff; border: 3px solid #111317; border-radius: 14px; box-shadow: 5px 5px 0 #111317; padding: 8px 18px 10px; font: 800 30px/1 Poppins; color: #111317; letter-spacing: -.5px; }
#titulo em { font: italic 400 38px/1 Serif; color: #2a63cd; }
#nombre { left: 22px; top: 760px; display: flex; align-items: center; gap: 12px; background: #2a63cd; border: 3px solid #111317; border-radius: 16px; box-shadow: 5px 5px 0 #111317; padding: 10px 18px 10px 12px; }
#nombre .es { width: 46px; height: 34px; border-radius: 8px; background: #fff; border: 2px solid #111317; display: flex; align-items: center; justify-content: center; font: 800 16px Poppins; color: #2a63cd; }
#nombre b { display: block; font: 800 28px/1 Poppins; color: #fff; }
#nombre small { display: block; margin-top: 3px; font: 600 13px Inter; color: rgba(255,255,255,.92); }
.chip { left: 50%; display: flex; align-items: center; gap: 10px; padding: 10px 18px; border-radius: 14px; border: 3px solid #111317; box-shadow: 5px 5px 0 #111317; font: 800 22px Poppins; white-space: nowrap; }
.chip svg { width: 24px; height: 24px; }
#web { top: 736px; background: #fff; color: #111317; }
#wa { top: 806px; background: #25d366; color: #fff; }
#flash { inset: 0; background: #fff; }
</style></head><body>
<div class="p" id="logo"><img src="assets/logo-color.png" alt=""></div>
<div class="p" id="titulo"><span>El nuevo del <em>equipo</em></span></div>
<div class="p" id="nombre"><span class="es">ES</span><div><b>Chispa</b><small>El nuevo de Electro Shop</small></div></div>
<div class="p chip" id="web"><svg viewBox="0 0 24 24" fill="none" stroke="#2a63cd" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>electroshopve.com</div>
<div class="p chip" id="wa"><svg viewBox="0 0 24 24" fill="#fff"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.6-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.9s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.3.5-.4.4c-.1.1-.3.3-.1.6.2.3.7 1.2 1.6 2 1.1.9 2 1.2 2.3 1.4.3.1.4.1.6-.1l.8-1c.2-.3.4-.2.6-.1l2 .9c.3.1.5.2.5.3.1.2.1.7-.1 1.3z"/></svg>+58 257 251 1282</div>
<div class="p" id="flash"></div>
<script>
// T2: donde empieza el segundo clip (el primero dura 9,963 s)
const T2 = 9.963, $ = s => document.getElementById(s);
const ease = x => 1 - Math.pow(1 - Math.min(1, Math.max(0, x)), 3);
const back = x => { x = Math.min(1, Math.max(0, x)); return 1 + 2.4 * Math.pow(x - 1, 3) + 1.4 * Math.pow(x - 1, 2); };
// aparece en a, se va en b: opacidad y un pequeño rebote
const ver = (el, t, a, b, dx = 0, centro = false) => {
  const k = t < a ? 0 : t < b ? back((t - a) / .35) : 1 - ease((t - b) / .25);
  const o = t < a ? 0 : t < b ? Math.min(1, (t - a) / .2) : Math.max(0, 1 - (t - b) / .25);
  el.style.opacity = o.toFixed(3);
  el.style.transform = `${centro ? 'translateX(-50%) ' : ''}translate(${(dx * (1 - k)).toFixed(1)}px, ${(18 * (1 - k)).toFixed(1)}px) scale(${(.85 + .15 * k).toFixed(3)})`;
};
window.DURATION = 20;
window.seek = (t) => {
  ver($('logo'), t, .2, 19.6);
  ver($('titulo'), t, .7, 3.6);
  ver($('nombre'), t, 4.5, 8.4, -40);
  ver($('web'), t, T2 + 2.75, 19.6, 0, true);
  ver($('wa'), t, T2 + 5.4, 19.6, 0, true);
  const fl = Math.abs(t - T2); $('flash').style.opacity = fl < .12 ? (1 - fl / .12).toFixed(2) : 0;
};
window.ready = document.fonts.ready.then(() => { window.seek(0); return true; });
</script></body></html>
