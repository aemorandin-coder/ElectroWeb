<!doctype html><html><head><meta charset="utf-8"><style>
@font-face { font-family: Poppins; src: url(../poppins-latin-700-normal.woff2); font-weight: 700; }
@font-face { font-family: Tektrron; src: url(../Tektrron.ttf); }
body { margin: 0; background: #f4efe4; font: 700 15px Poppins; }
.g { display: grid; grid-template-columns: repeat(4, 300px); gap: 10px; padding: 16px; }
.c { text-align: center; } .c svg { width: 300px; height: 315px; }
</style></head><body><div class="g" id="g"></div>
<script src="chispa.js"></script><script>
const v = [['habla','a','abiertos','normal'],['señala','e','abiertos','arriba'],['explica','sonrisa','abiertos','normal'],['pulgar','feliz','guino','normal'],
           ['brazos','sonrisa','cerrados','normal'],['hombros','o','sorpresa','duda'],['habla','seria','abiertos','duda'],['habla','feliz','abiertos','arriba']];
document.getElementById('g').innerHTML = v.map(([pose,boca,ojos,cejas]) => `<div class="c">${chispa({pose,boca,ojos,cejas})}<div>${pose} · ${boca}</div></div>`).join('');
</script></body></html>
