<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Chispa 2.0</title>
<style>
/*BASE*/
body { margin: 0; background: #000; }
#stage { position: relative; width: 540px; height: 960px; overflow: hidden; background: #f4efe4; }
#grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(17,19,23,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(17,19,23,.05) 1px, transparent 1px); background-size: 27px 27px; }
#head { position: absolute; left: 26px; right: 26px; top: 26px; display: flex; justify-content: space-between; align-items: center; }
#head .brand { display: flex; align-items: center; gap: 7px; padding: 5px 10px 5px 6px; border-radius: 999px; background: #fff; border: 1.5px solid #111317; }
#head .brand img { height: 15px; }
#head .chip { font: 700 10px Inter; letter-spacing: 1.2px; padding: 5px 9px; border-radius: 6px; border: 1.5px solid #111317; background: #fff; }
#titulo { position: absolute; left: 26px; right: 26px; top: 80px; font: 700 40px/1.05 Poppins; letter-spacing: -1px; color: #111317; }
#titulo em { font: italic 400 50px/1 Serif; }
#etq { position: absolute; left: 0; right: 0; top: 200px; display: flex; justify-content: center; }
#etq span { font: 700 16px Poppins; padding: 6px 12px; border-radius: 8px; background: #111317; color: #fff; }
#disc, #chispa { position: absolute; left: 20px; top: 300px; width: 500px; height: 525px; }
#chispa { transform-origin: 50% 100%; }
#chispa svg, #disc svg { width: 500px; height: 525px; }
@font-face { font-family: Serif; src: url(assets/instrument-serif-latin-400-italic.woff2); font-style: italic; }
</style></head>
<body>
<div id="stage">
  <div id="grid"></div>
  <div id="head"><div class="brand"><img src="assets/logo-color.png" alt=""></div><div class="chip">ELECTROSHOPVE.COM</div></div>
  <div id="titulo">Chispa <em>2.0</em></div>
  <div id="etq"><span id="etqT">Habla con las vocales reales</span></div>
  <div id="disc"><svg viewBox="0 0 400 420"><circle cx="200" cy="232" r="150" fill="#2a63cd"/><circle cx="200" cy="232" r="166" fill="none" stroke="#111317" stroke-width="2.5" stroke-dasharray="2 9" stroke-linecap="round" opacity=".5"/></svg></div>
  <div id="chispa"></div>
</div>
<script src="assets/mascota/chispa.js"></script>
<script>
// Demostración de Chispa 2.0: transiciones entre poses, boca por vocal, parpadeo, cabeza y pelo vivos, saludo y giro.
const VOZ = /*VOZ*/;
const D = 0.6; // la voz arranca a los 0,6 s
const voz = { palabras: VOZ.palabras.filter(p => p.b === 0).map(p => ({ ...p, t0: p.t0 + D, t1: p.t1 + D })), rms: Array(Math.round(D * 30)).fill(-60).concat(VOZ.rms.slice(0, 200)) };
const W = (w) => voz.palabras.find(p => p.w.toLowerCase().replace(/[^a-záéíóúñ]/g, '') === w).t0;
const labios = chispa.labios(voz);
const claves = [
  { t: 0, pose: 'hombros', cejas: 'duda', inc: -5, mirar: [0, 0] },
  { t: W('seguro') - .1, pose: 'explica', cejas: 'normal', inc: 0 },
  { t: W('tienda') - .1, mirar: [1, -.4] },
  { t: W('pero') - .15, pose: 'señala', cejas: 'arriba', mirar: [.6, -1], inc: 4 },
  { t: W('parte') - .1, pose: 'pulgar', ojos: 'guino', feliz: true, cejas: 'normal', mirar: [0, 0], inc: 0 },
  { t: 6.6, pose: 'saluda', ojos: 'feliz', boca: 'feliz' },
  { t: 8.6, pose: 'piensa', ojos: 'abiertos', boca: 'seria', cejas: 'duda', feliz: false, mirar: [-.8, -1], inc: -6 },
  { t: 10.2, vista: 'espalda', pose: 'espalda-señala-alto', inc: 0 },
  { t: 11.9, vista: 'frente', pose: 'celebra', ojos: 'feliz', boca: 'feliz', cejas: 'arriba', feliz: true, mirar: [0, 0] },
];
const ETQ = [[0, 'Habla con las vocales reales'], [6.6, 'Saluda'], [8.6, 'Piensa'], [10.2, 'Se voltea y señala'], [11.9, '¡Listo para la web!']];
const linea = chispa.linea(claves);
const giros = claves.filter(k => 'vista' in k).map(k => k.t);
const el = document.getElementById('chispa');
window.DURATION = 14;
window.seek = (t) => {
  const e = linea(t);
  const habla = t >= D && t < voz.palabras[voz.palabras.length - 1].t1 + .1;
  if (habla) Object.assign(e.boca, labios(t), { sonrisa: Math.max(.3, labios(t).sonrisa) });
  chispa.vida(e, t, { rms: habla ? voz.rms[Math.floor(t * 30)] : null });
  if (e.pose === 'saluda' || (e.R.mano === 'palma' && t > 6.6 && t < 8.6)) { const w = Math.sin((t - 6.6) * 11); e.R.giro += w * 20; e.R.muñeca = [e.R.muñeca[0] + w * 7, e.R.muñeca[1]]; e.cabeza.inc += w * 1.5; }
  e.fondo = false;
  el.innerHTML = chispa.rig(e);
  // entrada desde abajo con rebote; giro aplastando en X
  const ent = Math.min(1, t / .55), y = (1 - (1 + 2.2 * Math.pow(ent - 1, 3) + 1.2 * Math.pow(ent - 1, 2))) * 160;
  let sx = 1; for (const g of giros) { const d = Math.abs(t - g); if (d < .16) sx = Math.min(sx, Math.max(.04, d / .16)); }
  el.style.transform = `translateY(${y.toFixed(1)}px) scaleX(${sx.toFixed(3)})`;
  document.getElementById('disc').style.transform = `scale(${(.6 + .4 * Math.min(1, t / .5)).toFixed(3)})`;
  let txt = ETQ[0][1]; for (const [tt, s] of ETQ) if (t >= tt) txt = s; document.getElementById('etqT').textContent = txt;
};
window.ready = document.fonts.ready.then(() => { window.seek(0); return true; });
</script>
</body></html>
