<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Miniatura YouTube: La ficha de Electro Shop</title><style>
/* Miniatura de YouTube (1280 x 720) de "La ficha de Electro Shop" */
@font-face { font-family: Poppins; src: url(assets/poppins-latin-700-normal.woff2); font-weight: 700; }
@font-face { font-family: Poppins; src: url(assets/poppins-latin-800-normal.woff2); font-weight: 800; }

#ch { position: absolute; left: -10px; bottom: -6px; width: 600px; height: 630px; }

#txt { position: absolute; left: 600px; top: 150px; color: #fff; font: 800 84px/0.98 Poppins; letter-spacing: -2px; }
#txt .t { display: inline-block; margin-top: 14px; padding: 4px 26px 10px; background: #ffd54a; color: #111317; border: 5px solid #111317; border-radius: 18px; box-shadow: 10px 10px 0 #111317; transform: rotate(-3deg); font-size: 110px; }
#chips { position: absolute; left: 604px; top: 536px; display: flex; gap: 12px; }
#chips span { font: 700 23px Poppins; color: #111317; background: #fff; padding: 10px 20px; border-radius: 14px; border: 4px solid #111317; box-shadow: 6px 6px 0 #111317; }
#logo { position: absolute; right: 40px; top: 36px; background: #fff; padding: 12px 22px; border-radius: 999px; border: 4px solid #111317; }

</style></head><body><div id="m">
<div id="disco"></div><div id="ch"></div>

<div id="txt">No somos<br>solo una<br><span class="t">tienda</span></div>

</div>
<script src="assets/mascota/chispa.js"></script>

</body></html>
