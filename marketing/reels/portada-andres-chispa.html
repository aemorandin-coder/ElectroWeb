<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Portada: El nuevo del equipo</title><style>
/* Portada del reel (1080 x 1920). Lo importante va en el centro (1080 x 1440), que es lo que muestra la cuadrícula del perfil. */
@font-face { font-family: Poppins; src: url(assets/poppins-latin-800-normal.woff2); font-weight: 800; }
@font-face { font-family: Poppins; src: url(assets/poppins-latin-700-normal.woff2); font-weight: 700; }
@font-face { font-family: Serif; src: url(assets/instrument-serif-latin-400-italic.woff2); font-style: italic; }
* { margin: 0; box-sizing: border-box; }
body { width: 1080px; height: 1920px; overflow: hidden; }
#p { position: relative; width: 1080px; height: 1920px; background: url(assets/portada-andres-chispa.jpg) center / cover; }
#p::before { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,21,48,.0) 0%, rgba(10,21,48,.55) 14%, rgba(10,21,48,.55) 30%, rgba(10,21,48,0) 44%); }
#logo { position: absolute; left: 50%; top: 270px; transform: translateX(-50%); background: #fff; padding: 14px 26px; border-radius: 999px; border: 4px solid #111317; }
#logo img { height: 46px; display: block; }
#t { position: absolute; left: 0; right: 0; top: 380px; text-align: center; color: #fff; font: 800 92px/1 Poppins; letter-spacing: -3px; text-shadow: 0 6px 24px rgba(0,0,0,.35); }
#t em { display: inline-block; margin-top: 12px; font: italic 400 120px/1 Serif; letter-spacing: 0; color: #111317; background: #ffd54a; padding: 0 30px 14px; border: 5px solid #111317; border-radius: 22px; box-shadow: 10px 10px 0 #111317; transform: rotate(-2deg); text-shadow: none; }
#sello { position: absolute; left: 50%; bottom: 300px; transform: translateX(-50%) rotate(2deg); background: #2a63cd; color: #fff; font: 700 40px Poppins; padding: 14px 30px; border-radius: 18px; border: 4px solid #111317; box-shadow: 8px 8px 0 #111317; white-space: nowrap; }
</style></head><body><div id="p">
<div id="logo"><img src="assets/logo-color.png" alt=""></div>
<div id="t">El nuevo del<br><em>equipo</em></div>
<div id="sello">Les presentamos a Chispa</div>
</div></body></html>
